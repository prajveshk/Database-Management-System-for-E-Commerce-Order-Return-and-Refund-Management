version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/2_triggers.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/3_procedures.sql
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/4_indexes.sql

  web:
    build: .
    container_name: ecommerce_fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=ecommerce_db
    depends_on:
      - db
